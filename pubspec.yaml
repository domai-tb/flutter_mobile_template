name: mobile_app_skeleton
description: A Flutter mobile app skeleton with placeholder features and a clean-ish architecture.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Dependency Injection
  get_it: ^8.0.3

  # Localization
  intl: ^0.20.2

  # Local Storage
  shared_preferences: ^2.3.3

  # Functional Programming & Error Handling
  fpdart: ^1.1.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Logging
  logger: ^2.4.0

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  # Assets
  assets:
    - assets/l10n/
